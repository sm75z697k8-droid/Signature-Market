<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edf2ef">
  <meta name="description" content="A minimal five-button frosted-glass navigation concept.">
  <title>Signature Market — Navigation Concept</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <!-- Navigation only. No storefront, fake product screens, or third-party glass scripts. -->
  <nav class="floating-nav" aria-label="Primary navigation">
    <span class="nav-indicator" aria-hidden="true"><span class="nav-bubble"></span></span>

    <a class="nav-item is-active" href="#home" data-route="home" aria-label="Home" aria-current="page">
      <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true">
        <path d="m3.5 10 7.4-6.1a1.8 1.8 0 0 1 2.2 0l7.4 6.1v8.3a2.1 2.1 0 0 1-2.1 2.1H15v-5.8a1.7 1.7 0 0 0-1.7-1.7h-2.6A1.7 1.7 0 0 0 9 14.6v5.8H5.6a2.1 2.1 0 0 1-2.1-2.1V10Z"/>
      </svg>
    </a>

    <a class="nav-item" href="#products" data-route="products" aria-label="Products">
      <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true">
        <rect x="3.6" y="3.6" width="7" height="7" rx="2"/>
        <rect x="13.4" y="3.6" width="7" height="7" rx="2"/>
        <rect x="3.6" y="13.4" width="7" height="7" rx="2"/>
        <rect x="13.4" y="13.4" width="7" height="7" rx="2"/>
      </svg>
    </a>

    <a class="nav-item" href="#notifications" data-route="notifications" aria-label="Notifications">
      <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true">
        <path d="M18 9a6 6 0 0 0-12 0v3.4c0 1.7-.7 3.1-1.8 4.4a1 1 0 0 0 .8 1.6h14a1 1 0 0 0 .8-1.6c-1.1-1.3-1.8-2.7-1.8-4.4V9Z"/>
        <path d="M10 21h4"/>
      </svg>
    </a>

    <a class="nav-item" href="#cart" data-route="cart" aria-label="My Cart">
      <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true">
        <path d="M6.7 8.5h10.6a2 2 0 0 1 2 1.8l.9 8.2a2 2 0 0 1-2 2.2H5.8a2 2 0 0 1-2-2.2l.9-8.2a2 2 0 0 1 2-1.8Z"/>
        <path d="M9 9V6.8a3 3 0 0 1 6 0V9"/>
      </svg>
    </a>

    <a class="nav-item" href="#profile" data-route="profile" aria-label="Profile">
      <svg viewBox="0 0 24 24" class="nav-icon" aria-hidden="true">
        <circle cx="12" cy="8" r="4.1"/>
        <path d="M4.4 20.7a7.6 7.6 0 0 1 15.2 0"/>
      </svg>
    </a>
  </nav>
</body>
</html>
